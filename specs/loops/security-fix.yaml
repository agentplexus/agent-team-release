# Security Fix Loop - VEAL Pattern
# Validates security posture and automatically fixes issues

name: security-fix
type: VEAL
description: |
  Security validation and fix loop for Go projects.
  Validates dependencies, secrets, file permissions, and security best practices.
  Automatically fixes issues through security-fixer agent.

validator: security
actor: security-fixer

max_attempts: 3
escalation: human

success_criteria: |
  All security checks pass with GO status:
  - No known vulnerabilities in dependencies
  - No hardcoded secrets or credentials
  - Proper file permissions (no overly permissive modes)
  - gosec passes without critical issues

checks:
  - id: vuln-check
    description: Check for known vulnerabilities
    type: command
    command: govulncheck ./...
    required: true
    expected: No known vulnerabilities

  - id: gosec
    description: Run gosec security scanner
    type: command
    command: gosec -quiet ./...
    required: true
    expected: No high/critical severity issues

  - id: secrets
    description: Check for hardcoded secrets
    type: pattern
    pattern: "(password|secret|api_key|apikey|token)\\s*[:=]\\s*[\"'][^\"']+[\"']"
    files: "**/*.go"
    required: true
    expected: No hardcoded secrets

  - id: env-files
    description: Ensure .env files are gitignored
    type: pattern
    pattern: "\\.env"
    files: .gitignore
    required: false
    expected: .env pattern in .gitignore

  - id: file-permissions
    description: Check for overly permissive file modes
    type: pattern
    pattern: "0o?777|0o?666"
    files: "**/*.go"
    required: true
    expected: No world-writable permissions

  - id: tls-config
    description: Check TLS configuration
    type: pattern
    pattern: "InsecureSkipVerify:\\s*true"
    files: "**/*.go"
    required: false
    expected: No insecure TLS configurations
